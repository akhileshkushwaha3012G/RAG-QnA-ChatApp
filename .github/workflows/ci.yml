name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (filter editable local install)
        run: |
          python -m pip install --upgrade pip
          # Create a CI-friendly requirements file that excludes any local '-e' editable entries
          awk '!/^\s*-e\b/' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
          # Install the local package editable after dependencies
          pip install -e .

      - name: Run tests
        run: |
          PYTHONPATH=src python -m pytest -q
